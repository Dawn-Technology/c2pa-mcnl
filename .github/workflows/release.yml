name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - prod

permissions:
  actions: read
  contents: read
  packages: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VERIFY_WEBAPP_URL }}


    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@dawn-technology'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Angular app
        run: npx nx build verify-webapp --configuration=production

      - name: Upload to Scaleway Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          aws s3 sync \
            dist/apps/verify-webapp/browser \
            s3://${{ secrets.SCW_BUCKET }} \
            --delete \
            --endpoint-url https://s3.${{ secrets.SCW_REGION }}.scw.cloud
